name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install web dependencies (needed by the preprocessing parity test)
        run: npm ci
        working-directory: app
      - name: Install CPU torch and project
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest -q

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build the PWA
        run: npm run build
      - name: Check the offline bundle
        run: |
          test -f dist/sw.js
          test -f dist/model/plant-doctor-int8.onnx
          test -f dist/ort/ort-wasm-simd-threaded.wasm
          grep -q "model/plant-doctor-int8.onnx" dist/sw.js
          ! grep -q "__PRECACHE__" dist/sw.js
          du -sh dist
